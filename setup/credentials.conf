# Credentials this checkout installs from Bitwarden.
#   <destination> | <mode> | <name needles, most specific first, ';' separated>
#
# `platform.token` is NOT here: it is a refresh token that rotates on every
# use, so a stored copy is stale after the first refresh. The launcher logs you
# in instead.
~/.config/smalt/metabase.key|600|metabase api key;metabase key;metabase
